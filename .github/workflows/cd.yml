name: SCC&DP Enterprise CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-to-aws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Docker Image
        run: |
          cd backend
          docker build -t ${{ steps.login-ecr.outputs.registry }}/sccdp-backend:${{ github.sha }} .
          docker push ${{ steps.login-ecr.outputs.registry }}/sccdp-backend:${{ github.sha }}

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name sccdp-production-cluster --region us-east-1
          kubectl set image deployment/sccdp-backend sccdp-backend=${{ steps.login-ecr.outputs.registry }}/sccdp-backend:${{ github.sha }}
          kubectl rollout status deployment/sccdp-backend
