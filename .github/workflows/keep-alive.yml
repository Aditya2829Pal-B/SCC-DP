name: Render Keep-Alive Pinger

on:
  schedule:
    # Runs every 10 minutes to prevent Render free instance from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: |
          echo "Sending keep-alive ping to Render backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://scc-dp.onrender.com/health)
          echo "Render responded with HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ Server is alive and responsive!"
          else
            echo "⚠️ Server woke up or returned non-200 status ($HTTP_STATUS)"
          fi
